org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=1.21.1
# Only advertise game releases verified with a real desktop launch.
supported_minecraft_versions=1.20.1,1.21,1.21.1,26.3
minecraft_version_range=[1.21,1.21.1],[26.3]
neo_version=21.1.216
neo_version_range=[21,21.2),[26.3,26.4)
loader_version_range=[4,5),[12,13)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.13

# Mod Properties
mod_id=packupdater
mod_name=PackUpdater
mod_license=MIT
mod_version=1.6.3
mod_group_id=dev.packupdater
mod_authors=PackUpdater Contributors
mod_description=A single-jar NeoForge modpack updater for supported Minecraft releases. Updates a PackWiz pack before mods are discovered, including the installer's optional mods. Configured entirely through <gameDir>/config/packupdater.properties, so no JVM arguments are needed. Falls back to a silent update on platforms that cannot open a window from a child process.
