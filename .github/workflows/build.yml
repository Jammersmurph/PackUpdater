name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Verify the bootstrap jar loads on the Java Minecraft actually ships with
        run: |
          # Minecraft 1.21.1 runs on Java 21, which loads class files up to version 65. A jar
          # built on a newer local JDK carries a higher version and kills the fork path for
          # every user with UnsupportedClassVersionError, so this is checked on every build.
          #
          # Byte equality against the committed jar is deliberately not checked. jar's entry
          # order follows the filesystem, so two builds of identical sources differ across
          # machines and the comparison would fail forever. Both jobs rebuild from source
          # anyway, so a stale committed jar cannot reach a release.
          major=$(unzip -p src/main/resources/updater/packupdater-bootstrap.jar \
            link/infra/packwiz/installer/bootstrap/Main.class | od -An -tu1 -j6 -N2 | awk '{print $2}')
          if [ -z "$major" ]; then
            echo "::error::could not read the class file version of the bootstrap jar"
            exit 1
          fi
          if [ "$major" -gt 65 ]; then
            echo "::error::bootstrap jar is class file version $major, but Minecraft runs on Java 21 (65)"
            exit 1
          fi
          echo "bootstrap jar is class file version $major"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: packupdater
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          # Publish under a version-less asset name on purpose. Packs track this mod with a
          # [update.github] block, and packwiz's github updater overwrites the .pw.toml
          # "filename" with the release asset name on every update. A stable name keeps
          # instances at mods/packupdater.jar instead of accumulating one jar per release.
          install -m 644 build/libs/packupdater-"${version}".jar packupdater.jar

          # Ship the PackWiz override alongside the jar. Because the asset name is
          # version-less and the file carries an [update.github] block, one copy works for
          # every future release: packwiz update rewrites url, hash and tag as needed.
          # Written with printf, not a heredoc, so YAML block indentation and backslash
          # escaping cannot corrupt the TOML.
          sha="$(sha256sum packupdater.jar | cut -d' ' -f1)"
          {
            printf 'name = "PackUpdater"\n'
            printf 'filename = "packupdater.jar"\n'
            printf 'side = "both"\n'
            printf '\n'
            printf '[download]\n'
            printf 'url = "https://github.com/%s/releases/download/%s/packupdater.jar"\n' "$GITHUB_REPOSITORY" "$tag"
            printf 'hash-format = "sha256"\n'
            printf 'hash = "%s"\n' "$sha"
            printf '\n'
            printf '[update.github]\n'
            printf 'slug = "%s"\n' "$GITHUB_REPOSITORY"
            printf 'tag = "%s"\n' "$tag"
            printf 'regex = "^packupdater\\\\.jar$"\n'
          } > packupdater.pw.toml

          # Fail loudly rather than publishing an override packwiz cannot parse.
          grep -qx "hash = \"${sha}\"" packupdater.pw.toml
          grep -qx "tag = \"${tag}\"" packupdater.pw.toml

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            packupdater.jar \
            packupdater.pw.toml
          echo "Published $tag (mod_version=$version) as packupdater.jar + packupdater.pw.toml"