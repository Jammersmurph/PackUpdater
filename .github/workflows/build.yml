name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Verify no stale bootstrap jar was committed
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- src/main/resources/updater/packupdater-bootstrap.jar; then
            echo "::error::packupdater-bootstrap.jar is out of date; run ./bootstrap/build.sh and commit the result"
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: packupdater
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            build/libs/*.jar \
          echo "Published $tag (mod_version=$version)"