name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
            21
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Verify the bootstrap jar loads on the Java Minecraft actually ships with
        run: |
          # The oldest supported game release uses Java 17 (class files up to version 61). A jar
          # built on a newer local JDK carries a higher version and kills the fork path for
          # every user with UnsupportedClassVersionError, so this is checked on every build.
          #
          # Byte equality against the committed jar is deliberately not checked. jar's entry
          # order follows the filesystem, so two builds of identical sources differ across
          # machines and the comparison would fail forever. Both jobs rebuild from source
          # anyway, so a stale committed jar cannot reach a release.
          major=$(unzip -p src/main/resources/updater/packupdater-bootstrap.jar \
            link/infra/packwiz/installer/bootstrap/Main.class | od -An -tu1 -j6 -N2 | awk '{print $2}')
          if [ -z "$major" ]; then
            echo "::error::could not read the class file version of the bootstrap jar"
            exit 1
          fi
          if [ "$major" -gt 61 ]; then
            echo "::error::bootstrap jar is class file version $major, but the minimum supported runtime is Java 17 (61)"
            exit 1
          fi
          echo "bootstrap jar is class file version $major"

      - name: Verify the single mod jar targets Java 17
        run: |
          python3 - <<'PY'
          import glob, io, zipfile
          jars = glob.glob("build/libs/*.jar")
          assert len(jars) == 1, f"Expected one distributable jar, got {jars}"
          def verify(jar):
              for name in jar.namelist():
                  if name.endswith(".class"):
                      major = int.from_bytes(jar.read(name)[6:8], "big")
                      assert major <= 61, f"{name} requires class-file version {major}"
          with zipfile.ZipFile(jars[0]) as jar:
              verify(jar)
              assert not any("compat" in n.lower() and "probe" in n.lower() for n in jar.namelist())
              with zipfile.ZipFile(io.BytesIO(jar.read("updater/packupdater-bootstrap.jar"))) as bootstrap:
                  verify(bootstrap)
          PY

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: packupdater
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
            21
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          # Publish under a version-less asset name on purpose. Packs track this mod with a
          # [update.github] block, and packwiz's github updater overwrites the .pw.toml
          # "filename" with the release asset name on every update. A stable name keeps
          # instances at mods/packupdater.jar instead of accumulating one jar per release.
          install -m 644 build/libs/packupdater-"${version}".jar packupdater.jar

          # Ship the PackWiz override alongside the jar. Because the asset name is
          # version-less and the file carries an [update.github] block, one copy works for
          # every future release: packwiz update rewrites url, hash and tag as needed.
          # Written with printf, not a heredoc, so YAML block indentation and backslash
          # escaping cannot corrupt the TOML.
          sha="$(sha256sum packupdater.jar | cut -d' ' -f1)"
          {
            printf 'name = "PackUpdater"\n'
            printf 'filename = "packupdater.jar"\n'
            printf 'side = "both"\n'
            printf '\n'
            printf '[download]\n'
            printf 'url = "https://github.com/%s/releases/download/%s/packupdater.jar"\n' "$GITHUB_REPOSITORY" "$tag"
            printf 'hash-format = "sha256"\n'
            printf 'hash = "%s"\n' "$sha"
            printf '\n'
            printf '[update.github]\n'
            printf 'slug = "%s"\n' "$GITHUB_REPOSITORY"
            printf 'tag = "%s"\n' "$tag"
            printf 'regex = "^packupdater\\\\.jar$"\n'
          } > packupdater.pw.toml

          # Fail loudly rather than publishing an override packwiz cannot parse.
          grep -qx "hash = \"${sha}\"" packupdater.pw.toml
          grep -qx "tag = \"${tag}\"" packupdater.pw.toml

          # Ship the default config alongside the other assets. It is taken straight from
          # src/main/resources so it is the same file the mod writes on first run, and a
          # modpack author needs nothing hand-written.
          install -m 644 src/main/resources/default-packupdater.properties packupdater.properties

          # Optional authoring template, hosted beside pack.toml rather than installed
          # into the client's config folder. Paths in this example must be customized.
          install -m 644 examples/optional-groups.toml optional-groups.toml

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            packupdater.jar \
            packupdater.pw.toml \
            packupdater.properties \
            optional-groups.toml
          echo "Published $tag (mod_version=$version): packupdater.jar, packupdater.pw.toml, packupdater.properties, optional-groups.toml"

      - name: Publish latest main release to Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          # Tag workflows do not identify a source branch. Check ancestry explicitly,
          # and only mirror the release GitHub currently considers latest.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Skipping Modrinth: $GITHUB_REF_NAME is not on main."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          if ! jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag_name == $tag and .draft == false and .prerelease == false' release.json > /dev/null; then
            echo "Skipping Modrinth: $GITHUB_REF_NAME is not the latest stable release."
            exit 0
          fi
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::MODRINTH_TOKEN must be set as a repository secret."
            exit 1
          fi

          # Authenticate project lookup too, so this works before project approval.
          api="https://api.modrinth.com/v2"
          user_agent="$GITHUB_REPOSITORY (GitHub Actions)"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $user_agent" \
            "$api/project/packwiz-updater" > modrinth-project.json
          project_id="$(jq -er '.id' modrinth-project.json)"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          minecraft_versions="$(grep -E '^supported_minecraft_versions=' gradle.properties | cut -d= -f2)"
          if [ -z "$minecraft_versions" ]; then
            echo "::error::supported_minecraft_versions must list the supported Minecraft releases."
            exit 1
          fi

          # Avoid duplicate versions if publication is retried.
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $user_agent" \
            "$api/project/$project_id/version" > modrinth-versions.json
          if jq -e --arg version "$version" \
            'any(.[]; .version_number == $version)' modrinth-versions.json > /dev/null; then
            echo "Modrinth already has version $version; skipping."
            exit 0
          fi

          jq --arg project_id "$project_id" --arg version "$version" \
            --arg minecraft_versions "$minecraft_versions" '{
              project_id: $project_id,
              name: .name,
              version_number: $version,
              changelog: (.body // ""),
              dependencies: [],
              game_versions: ($minecraft_versions | split(",")),
              version_type: "release",
              loaders: ["neoforge"],
              featured: true,
              status: "listed",
              file_parts: ["file"],
              primary_file: "file"
            }' release.json > modrinth-version.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $user_agent" \
            --form 'data=<modrinth-version.json;type=application/json' \
            --form 'file=@packupdater.jar;type=application/java-archive' \
            "$api/version"
