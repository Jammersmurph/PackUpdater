# Earlier NeoForge releases read mods.toml, before neoforge.mods.toml was introduced.
# Startup is provided by the transformation service in either package namespace.
modLoader = "lowcodefml"
loaderVersion = "[1,4),[47,48)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
# NeoForge 1.20.1 still identifies the loader mod as "forge". Later releases
# identify it as "neoforge", so validate whichever identifier is present.
mandatory = false
versionRange = "[47,48)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "neoforge"
mandatory = false
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
