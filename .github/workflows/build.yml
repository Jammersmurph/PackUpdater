name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Verify the committed bootstrap jar matches a fresh build
        run: |
          # Guards two ways of getting this wrong. A stale committed jar ships whatever was
          # committed instead of the current sources, and a jar built on a newer local JDK
          # carries a class file version that Minecraft's Java 21 cannot load, which kills the
          # fork path for every user with UnsupportedClassVersionError.
          # Compared by content against HEAD, not with git diff: the step above has already
          # rebuilt the jar in the working tree, so a diff would always report a change.
          committed=$(git show HEAD:src/main/resources/updater/packupdater-bootstrap.jar | sha256sum | cut -d' ' -f1)
          fresh=$(sha256sum src/main/resources/updater/packupdater-bootstrap.jar | cut -d' ' -f1)
          if [ "$committed" != "$fresh" ]; then
            echo "::error::packupdater-bootstrap.jar is out of date; run ./bootstrap/build.sh and commit the result"
            exit 1
          fi
          major=$(od -An -tu1 -j6 -N2 \
            <(unzip -p src/main/resources/updater/packupdater-bootstrap.jar link/infra/packwiz/installer/bootstrap/Main.class) \
            | awk '{print $2}')
          if [ "$major" -gt 65 ]; then
            echo "::error::bootstrap jar is class file version $major, but Minecraft runs on Java 21 (65)"
            exit 1
          fi
          echo "bootstrap jar is class file version $major"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: packupdater
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          # Publish under a version-less asset name on purpose. Packs track this mod with a
          # [update.github] block, and packwiz's github updater overwrites the .pw.toml
          # "filename" with the release asset name on every update. A stable name keeps
          # instances at mods/packupdater.jar instead of accumulating one jar per release.
          install -m 644 build/libs/packupdater-"${version}".jar packupdater.jar

          # Ship the PackWiz override alongside the jar. Because the asset name is
          # version-less and the file carries an [update.github] block, one copy works for
          # every future release: packwiz update rewrites url, hash and tag as needed.
          # Written with printf, not a heredoc, so YAML block indentation and backslash
          # escaping cannot corrupt the TOML.
          sha="$(sha256sum packupdater.jar | cut -d' ' -f1)"
          {
            printf 'name = "PackUpdater"\n'
            printf 'filename = "packupdater.jar"\n'
            printf 'side = "both"\n'
            printf '\n'
            printf '[download]\n'
            printf 'url = "https://github.com/%s/releases/download/%s/packupdater.jar"\n' "$GITHUB_REPOSITORY" "$tag"
            printf 'hash-format = "sha256"\n'
            printf 'hash = "%s"\n' "$sha"
            printf '\n'
            printf '[update.github]\n'
            printf 'slug = "%s"\n' "$GITHUB_REPOSITORY"
            printf 'tag = "%s"\n' "$tag"
            printf 'regex = "^packupdater\\\\.jar$"\n'
          } > packupdater.pw.toml

          # Fail loudly rather than publishing an override packwiz cannot parse.
          grep -qx "hash = \"${sha}\"" packupdater.pw.toml
          grep -qx "tag = \"${tag}\"" packupdater.pw.toml

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            packupdater.jar \
            packupdater.pw.toml
          echo "Published $tag (mod_version=$version) as packupdater.jar + packupdater.pw.toml"