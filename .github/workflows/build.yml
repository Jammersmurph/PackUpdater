name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Verify no stale bootstrap jar was committed
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- src/main/resources/updater/packupdater-bootstrap.jar; then
            echo "::error::packupdater-bootstrap.jar is out of date; run ./bootstrap/build.sh and commit the result"
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: packupdater
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Rebuild embedded bootstrap
        run: ./bootstrap/build.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag $tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          # Publish under a version-less asset name on purpose. Packs track this mod with a
          # [update.github] block, and packwiz's github updater overwrites the .pw.toml
          # "filename" with the release asset name on every update. A stable name keeps
          # instances at mods/packupdater.jar instead of accumulating one jar per release.
          install -m 644 build/libs/packupdater-"${version}".jar packupdater.jar
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            packupdater.jar
          echo "Published $tag (mod_version=$version) as asset packupdater.jar"